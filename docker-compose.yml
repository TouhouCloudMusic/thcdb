services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-devuser}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-devuser}"
      POSTGRES_DB: "${POSTGRES_DB:-devdb}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432"
    networks:
      - backend

  redis:
    image: valkey/valkey:9-alpine@sha256:b4ee67d73e00393e712accc72cfd7003b87d0fcd63f0eba798b23251bfc9c394
    restart: unless-stopped
    command: valkey-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redisdata:/data
    networks:
      - backend

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    restart: on-failure:3
    init: true
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SESSION_SECURE: "false"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-changeme}"
      MIDDLEWARE__LIMIT__REQ_PER_SEC: "1000000"
      DATABASE_URL: "postgres://${POSTGRES_USER:-devuser}:${POSTGRES_PASSWORD:-devuser}@db:5432/${POSTGRES_DB:-devdb}"
      REDIS_URL: "redis://redis:6379"
    ports:
      - "${SERVER_PORT:-12345}:12345"
    volumes:
      - ./server:/app
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
      - server_target:/app/target
      - server_public:/app/public
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:12345/health_check"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 120s
    command: cargo watch --ignore log --ignore log.* -x run
    networks:
      - backend

  web:
    image: node:24-bookworm-slim
    restart: unless-stopped
    init: true
    working_dir: /app
    depends_on:
      server:
        condition: service_healthy
    environment:
      CI: "true"
      VITE_SERVER_URL: "http://server:12345"
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./web:/app
      - node_modules:/app/node_modules
      - pnpm-store:/pnpm-store
    command: sh -c "corepack enable && corepack prepare pnpm@10 --activate && pnpm install --frozen-lockfile --store-dir /pnpm-store && pnpm dev --host 0.0.0.0"
    networks:
      - backend

networks:
  backend:

volumes:
  cargo_git:
  cargo_registry:
  pgdata:
  redisdata:
  pnpm-store:
  node_modules:
  server_public:
  server_target:
