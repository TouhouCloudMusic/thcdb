name: Prepare release

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: prepare-release
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  prepare_release:
    name: Prepare release pull request
    runs-on: ubuntu-latest
    steps:
      - name: Open or reuse release pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const base = "main";
            const head = "dev";
            const { owner, repo } = context.repo;

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              base,
              head: `${owner}:${head}`,
              per_page: 100,
            });
            if (openPulls.length > 0) {
              core.info(`Reusing pull request #${openPulls[0].number}.`);
              return;
            }

            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: `${base}...${head}`,
            });
            if (comparison.data.ahead_by === 0) {
              core.info(`${head} has no new commits to release to ${base}.`);
              return;
            }

            const created = await github.rest.pulls.create({
              owner,
              repo,
              base,
              head,
              title: `Merge ${head} into ${base}`,
            });
            core.info(`Created pull request #${created.data.number}.`);
