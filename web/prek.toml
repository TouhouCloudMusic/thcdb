fail_fast = true

[[repos]]
repo = "local"

[[repos.hooks]]
id = "web-oxfmt"
name = "web oxfmt"
entry = "pnpm exec oxfmt --check --no-error-on-unmatched-pattern"
language = "system"
types_or = [
    "css",
    "html",
    "javascript",
    "json",
    "jsx",
    "markdown",
    "scss",
    "ts",
    "tsx",
    "yaml",
]
stages = [ "pre-commit" ]

[[repos.hooks]]
id             = "web-check"
name           = "web check"
entry          = "just check"
language       = "system"
pass_filenames = true
types_or       = [ "javascript", "jsx", "ts", "tsx" ]
stages         = [ "pre-commit", "pre-push" ]
