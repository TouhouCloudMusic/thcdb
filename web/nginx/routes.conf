proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

location /api/ {
  proxy_pass http://server:12345/;
}

location = /api/user-events/stream {
  proxy_buffering off;
  proxy_pass http://server:12345/user-events/stream;
}

location = /api/admin/observability/auth {
  return 404;
}

location = /_observability_auth {
  internal;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_pass http://server:12345/admin/observability/auth;
}

location ~ ^/observability(?:/|$) {
  auth_request /_observability_auth;
  auth_request_set $observability_user $upstream_http_x_webauth_user;

  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-WEBAUTH-USER $observability_user;
  proxy_set_header Authorization "";
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  proxy_pass http://grafana_backend;
}
