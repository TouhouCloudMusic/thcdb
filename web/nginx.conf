include /etc/nginx/includes/http.conf;

server {
  listen 80;
  server_name _;
  client_max_body_size 25m;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/includes/routes.conf;

  location /assets/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
