[dev-dependencies]
fake     = { version = "5.1.0", features = [ "derive" ] }
proptest = "1"

# https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
debug     = 0
opt-level = 1
strip     = "debuginfo"
# If you get incremental compilation ICE, disable it
# incremental     = false

[profile.dev.build-override]
opt-level = 3

[profile.ra]
# incremental = false
inherits = "dev"
[profile.debug-mode]
debug     = 2
inherits  = "dev"
opt-level = 0
strip     = "none"

[profile.release]
codegen-units   = 1
debug           = false
lto             = "thin"
opt-level       = 3
overflow-checks = true
panic           = "abort"

[features]
release = [
    "mimalloc",
]
integration-test = [  ]
