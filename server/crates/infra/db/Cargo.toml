[package]
edition = "2024"
name    = "thcdb-infra-db"
publish = false
version = "0.1.0"

[lints]
workspace = true

[lib]
name = "infra_db"
path = "src/lib.rs"

[features]
migrations = [ "dep:migration", "dep:sea-orm-migration" ]

[dependencies]
fastrace.workspace            = true
futures-util.workspace        = true
infra_observability.workspace = true
infra_error.workspace         = true
derive_more.workspace         = true
frunk                         = { version = "0.4.3", features = [ "std" ] }
itertools.workspace           = true
migration                     = { workspace = true, optional = true }
proc_macros.workspace         = true
sea-orm.workspace             = true
sea-orm-migration             = { workspace = true, optional = true }
sea-query.workspace           = true
strum.workspace               = true
